name: Pages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # komplette Historie und Tags für git describe
      - name: Write version
        run: |
          VERSION="$(git describe --tags --always)"
          printf "window.APP_VERSION = '%s';\n" "$VERSION" > js/version.js
          echo "Version: $VERSION"
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html css js img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
